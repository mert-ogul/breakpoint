[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breakpoint-eval"
version = "0.1.0"
description = "Evaluate pretrained robot policies under controlled simulation stress."
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Feasibility stack pins live in docs/compatibility.md and requirements-feasibility.txt.
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0.0",
]
onnx = [
  "onnx>=1.16,<1.19",
  "onnxruntime>=1.19,<1.23",
]

[project.scripts]
breakpoint = "breakpoint_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires local sim / Hub downloads",
]

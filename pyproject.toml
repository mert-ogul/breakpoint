[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "breakpoint-eval"
version = "0.1.0"
description = "Evaluate pretrained robot policies under controlled simulation stress."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
]
# Core: CLI help / argparse only. No torch, LeRobot, MuJoCo, or ONNX.
dependencies = []

[project.optional-dependencies]
# Offline unit/dev checks (no MuJoCo / gym-aloha required).
# With only [dev]: ONNX tests skip (importorskip onnx/onnxruntime), report plot
# tests skip (importorskip matplotlib), H.264 stream encode tests skip without
# FFmpeg+PyAV. BREAKPOINT_FAIL_ON_SKIP=1 turns those skips into failures (CI sets it).
# Integration markers need requirements-simulation.txt + vendor LeRobot.
# Full offline suite: pip install -e ".[dev,onnx,report,h264]"
dev = [
  "ruff==0.17.0",
  "pytest>=8.0.0",
  "numpy>=1.26,<3",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "opencv-python>=4.8,<6",
]
# breakpoint profile / export ONNX paths (numpy + ORT; profile must not import sim/torch).
onnx = [
  "numpy>=1.26,<3",
  "onnx>=1.16,<1.19",
  "onnxruntime>=1.19,<1.23",
]
# breakpoint report plots
report = [
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<3.11",
]
# Optional H.264: also requires system FFmpeg with libx264 on PATH.
# See docs/methodology.md and breakpoint_eval.h264_ffmpeg.INSTALL_GUIDANCE.
h264 = [
  "numpy>=1.26,<3",
  "av>=12,<19",
]
# Simulator stack pins live in requirements-simulation.txt (install separately from
# this editable package). Run / export / real policy smoke need that file + vendor LeRobot.
# Pi/edge ORT profile: requirements-pi-profile.txt + [onnx] only (no torch/sim).

[project.scripts]
breakpoint = "breakpoint_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires local sim / Hub downloads",
  "requires_onnx: needs onnx and onnxruntime ([onnx] extra); skipped with a reason when absent",
]
